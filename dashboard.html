<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel do Cogni Companion — acompanhe as conversas, o aprendizado e os planos de estudo da criança."
    />
    <meta name="theme-color" content="#f0f0f0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
    <title>Painel — Cogni Companion</title>

    <!-- Roda antes de pintar a tela: aplica o tema salvo (anti-flash) e
         marca .js no <html> para ativar os estados de animação. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("js");
        try {
          var saved = localStorage.getItem("cognify-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          root.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>

    <!-- Fontes do projeto: Wittgenstein (título) + Zilla Slab (corpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gugi&family=Wittgenstein:ital,wght@0,400;0,500;0,600;0,900;1,900&family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Estilos (ordem importa: tokens → base → componentes do dashboard).
         O dashboard reusa tokens.css/base.css/auth-ui.css do site (badge,
         toasts, foco acessível) e adiciona suas próprias camadas. -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth-ui.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/dashboard-home.css" />
    <link rel="stylesheet" href="css/dashboard-conversas.css" />
    <link rel="stylesheet" href="css/dashboard-aprendizado.css" />
    <link rel="stylesheet" href="css/dashboard-planos.css" />
    <link rel="stylesheet" href="css/dashboard-rosto.css" />
    <link rel="stylesheet" href="css/dashboard-config.css" />
    <link rel="stylesheet" href="css/dashboard-onboarding.css" />
  </head>
  <body class="dash-body">
    <!-- Link de pular para o conteúdo (acessibilidade por teclado) -->
    <a href="#dash-main" class="dash-skip-link">Pular para o conteúdo</a>

    <div class="dash-shell" data-dash-shell>
      <!-- ===================== SIDEBAR ===================== -->
      <aside class="dash-sidebar" data-dash-sidebar aria-label="Navegação do painel">
        <!-- Marca: Cogni Companion (no topo da sidebar). Leva ao início do
             painel (#/inicio); o retorno ao site fica no menu da conta. -->
        <a href="#/inicio" class="dash-brand" aria-label="Cogni Companion — ir para o início do painel">
          <span class="dash-brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="8" width="16" height="12" rx="3" />
              <path d="M12 8V5" />
              <circle cx="12" cy="3.5" r="1.5" fill="currentColor" stroke="none" />
              <path d="M2 13v3M22 13v3" />
              <circle cx="9" cy="14" r="1.4" fill="currentColor" stroke="none" />
              <circle cx="15" cy="14" r="1.4" fill="currentColor" stroke="none" />
            </svg>
          </span>
          <span class="dash-brand__text">
            <span class="dash-brand__title">Cogni</span>
            <span class="dash-brand__subtitle">Companion</span>
          </span>
        </a>

        <!-- Card do perfil da criança pareada (single-child: sem seletor) -->
        <div class="dash-child" data-dash-child>
          <span class="dash-child__avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21a8 8 0 0 1 16 0" />
            </svg>
          </span>
          <span class="dash-child__name" data-dash-child-name>—</span>
          <span class="dash-child__meta" data-dash-child-meta></span>
        </div>

        <!-- Navegação principal do painel. Os itens são links de hash;
             o router.js troca a seção sem recarregar a página. -->
        <nav class="dash-nav" aria-label="Seções do painel">
          <a href="#/inicio" class="dash-nav__link" data-dash-link="inicio">
            <span class="dash-nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v10h14V10" /></svg>
            </span>
            <span>Início</span>
          </a>
          <a href="#/conversas" class="dash-nav__link" data-dash-link="conversas">
            <span class="dash-nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.2 7.7L3 21l1.8-5.8A8.5 8.5 0 1 1 21 11.5Z" /></svg>
            </span>
            <span>Conversas</span>
          </a>
          <a href="#/aprendizado" class="dash-nav__link" data-dash-link="aprendizado">
            <span class="dash-nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 4H11v15.5H5.5A2.5 2.5 0 0 0 3 22Z" /><path d="M21 5.5A2.5 2.5 0 0 0 18.5 4H13v15.5h5.5A2.5 2.5 0 0 1 21 22Z" /></svg>
            </span>
            <span>Aprendizado</span>
          </a>
          <a href="#/planos" class="dash-nav__link" data-dash-link="planos">
            <span class="dash-nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5" /><path d="M3.5 9.5h17M8 3v4M16 3v4" /></svg>
            </span>
            <span>Planos</span>
          </a>
          <!-- Única seção do painel feita pra CRIANÇA usar (ver sections/rosto.js). -->
          <a href="#/rosto" class="dash-nav__link" data-dash-link="rosto">
            <span class="dash-nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5" /><rect x="6.5" y="9.5" width="4.5" height="5" rx="2" fill="currentColor" stroke="none" /><rect x="13" y="9.5" width="4.5" height="5" rx="2" fill="currentColor" stroke="none" /></svg>
            </span>
            <span>Rosto da Cogni</span>
          </a>
          <a href="#/config" class="dash-nav__link" data-dash-link="config">
            <span class="dash-nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
            </span>
            <span>Configurações</span>
          </a>
        </nav>

        <!-- Rodapé da sidebar: no mobile recebe a badge da conta (injetada pelo
             session.js), já que o header mobile fica só com toggle + sino. -->
        <div class="dash-sidebar__account" data-dash-sidebar-account></div>
      </aside>

      <!-- Backdrop que escurece o fundo quando a sidebar abre no mobile -->
      <div class="dash-backdrop" data-dash-backdrop hidden></div>

      <!-- ===================== ÁREA PRINCIPAL ===================== -->
      <div class="dash-main-col">
        <!-- Header do painel (sem links de navegação — só controles).
             Esquerda: hambúrguer (mobile) + marca compacta. Direita:
             toggle de tema + badge da conta. -->
        <header class="dash-header">
          <div class="dash-header__left">
            <button
              type="button"
              class="dash-menu-toggle"
              data-dash-menu-toggle
              aria-label="Abrir menu"
              aria-expanded="false"
              aria-controls="dash-sidebar"
            >
              <span></span><span></span><span></span>
            </button>

            <!-- Marca compacta que aparece só no mobile (a sidebar fica oculta).
                 Mesmo destino do logo da sidebar: o início do painel. -->
            <a href="#/inicio" class="dash-header__brand" aria-label="Cogni Companion — ir para o início do painel">
              <span class="dash-header__brand-title">Cogni</span>
              <span class="dash-header__brand-sub">Companion</span>
            </a>
          </div>

          <div class="dash-header__right" data-dash-header-right>
            <!-- Toggle de tema (mesmo componente/markup do site) -->
            <button
              type="button"
              class="theme-toggle"
              data-theme-toggle
              aria-pressed="false"
              aria-label="Ativar modo escuro"
            >
              <span class="theme-toggle__label" aria-hidden="true"
                ><span class="label-on">On</span
                ><span class="label-off">Off</span></span
              >
              <span class="theme-toggle__knob" aria-hidden="true">
                <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none" />
                  <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                </svg>
                <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
              </span>
            </button>

            <!-- A badge da conta (avatar + nome + dropdown) é injetada aqui
                 pelo session.js, exatamente como no header do site. -->
          </div>
        </header>

        <!-- Conteúdo da seção ativa (injetado pelo router) -->
        <main class="dash-main" id="dash-main" data-dash-outlet tabindex="-1">
          <!-- Skeleton inicial enquanto o JS monta a primeira seção -->
          <div class="dash-loading" data-dash-loading>
            <span class="dash-loading__spinner" aria-hidden="true"></span>
            <p>Carregando o painel…</p>
          </div>
        </main>

        <!-- Tab bar inferior (mobile): atalhos para as seções principais -->
        <nav class="dash-tabbar" aria-label="Navegação rápida">
          <a href="#/inicio" class="dash-tabbar__link" data-dash-link="inicio">
            <span class="dash-tabbar__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5" /><path d="M5 10v10h14V10" /></svg>
            </span>
            <span class="dash-tabbar__label">Início</span>
          </a>
          <a href="#/conversas" class="dash-tabbar__link" data-dash-link="conversas">
            <span class="dash-tabbar__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.2 7.7L3 21l1.8-5.8A8.5 8.5 0 1 1 21 11.5Z" /></svg>
            </span>
            <span class="dash-tabbar__label">Conversas</span>
          </a>
          <a href="#/aprendizado" class="dash-tabbar__link" data-dash-link="aprendizado">
            <span class="dash-tabbar__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 4H11v15.5H5.5A2.5 2.5 0 0 0 3 22Z" /><path d="M21 5.5A2.5 2.5 0 0 0 18.5 4H13v15.5h5.5A2.5 2.5 0 0 1 21 22Z" /></svg>
            </span>
            <span class="dash-tabbar__label">Aprendiz.</span>
          </a>
          <a href="#/planos" class="dash-tabbar__link" data-dash-link="planos">
            <span class="dash-tabbar__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5" /><path d="M3.5 9.5h17M8 3v4M16 3v4" /></svg>
            </span>
            <span class="dash-tabbar__label">Planos</span>
          </a>
          <a href="#/rosto" class="dash-tabbar__link" data-dash-link="rosto">
            <span class="dash-tabbar__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5" /><rect x="6.5" y="9.5" width="4.5" height="5" rx="2" fill="currentColor" stroke="none" /><rect x="13" y="9.5" width="4.5" height="5" rx="2" fill="currentColor" stroke="none" /></svg>
            </span>
            <span class="dash-tabbar__label">Rosto</span>
          </a>
          <a href="#/config" class="dash-tabbar__link" data-dash-link="config">
            <span class="dash-tabbar__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" /><circle cx="12" cy="12" r="3" /></svg>
            </span>
            <span class="dash-tabbar__label">Config.</span>
          </a>
        </nav>
      </div>
    </div>

    <!-- Scripts (defer: executam na ordem do documento).
         Supabase (CDN) → config → toast → session → theme vêm primeiro,
         pra window.cognifyAuth/cognifyToast já existirem quando o
         dashboard rodar. Os módulos do painel usam ES modules. -->
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2/dist/umd/supabase.min.js"
      integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="js/supabase-config.js" defer></script>
    <script src="js/toast.js" defer></script>
    <script src="js/session.js" defer></script>
    <script src="js/theme.js" defer></script>

    <!-- Painel (ES module: importa router, seções, mock e helpers) -->
    <script type="module" src="js/dashboard/main.js"></script>
  </body>
</html>
